# Publica el sitio en GitHub Pages.
#
# Antes usábamos el constructor "legacy" (el que se dispara solo al pushear a
# main). Dejó de funcionar: los despliegues se quedaban en deployment_queued y
# abortaban a los diez minutos, así que el sitio quedó congelado en una versión
# vieja. Este flujo hace lo mismo por Actions, que es el camino soportado.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # El sitio es estático puro: se sube el repo tal cual, con su .nojekyll
      # y su CNAME.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
