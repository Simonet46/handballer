# Publica el sitio en GitHub Pages.
#
# Antes usábamos el constructor "legacy" (el que se dispara solo al pushear a
# main). Dejó de funcionar: los despliegues se quedaban en deployment_queued y
# abortaban a los diez minutos, así que el sitio quedó congelado en una versión
# vieja. Este flujo hace lo mismo por Actions, que es el camino soportado.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # En true a propósito, al revés de lo que sugiere la plantilla de GitHub.
  # Con false, un run que se cuelga esperando el entorno retiene el candado y
  # todo lo que viene detrás hace fila: nos dejó el sitio dos días sirviendo
  # una versión vieja hasta que lo cancelamos a mano. Cancelar un despliegue
  # en curso no cuesta nada acá, porque el siguiente publica el sitio entero.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MANO A MANO sale a producción solo si la variable del repo
      # FEATURE_MANO_A_MANO vale "true" (Settings → Secrets and variables →
      # Actions → Variables). Apagada, se podan los directorios antes de
      # subir el artefacto y /mano-a-mano da un 404 de verdad.
      - name: Podar mano a mano (flag apagado)
        if: vars.FEATURE_MANO_A_MANO != 'true'
        run: rm -rf mano-a-mano fr/mano-a-mano de/mano-a-mano mam.css assets/og-mano-a-mano.png
      - uses: actions/configure-pages@v5
      # El sitio es estático puro: se sube el repo tal cual, con su .nojekyll
      # y su CNAME.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
